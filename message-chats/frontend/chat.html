<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5b35bd">
    <title>VYBE - Chat & Messaging</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page-glow glow-one"></div>
<div class="page-glow glow-two"></div>

<div class="chat-container glass-card" id="chatApp">
    <aside class="sidebar" aria-label="Chats and contacts">
        <div class="sidebar-top">
            <a class="logo" href="#" aria-label="VYBE home">VYBE<span>.</span></a>
            <button class="icon-button" id="newGroupButton" type="button" aria-label="Create a group chat" title="Create group">+</button>
        </div>
        <div class="profile">
            <div class="avatar self-avatar" id="selfAvatar" aria-hidden="true">V</div>
            <div class="profile-info">
                <h2 id="selfName">User</h2>
                <p class="presence-label"><span class="status-dot online"></span>Online</p>
            </div>
            <button class="icon-button notification-button" id="notificationButton" type="button" title="Enable desktop notifications" aria-label="Enable desktop notifications">🔔</button>
        </div>
        <div class="contacts-heading">
            <h2>Messages</h2>
            <span id="chatCount" class="chat-count"></span>
        </div>
        <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input type="search" id="searchUsers" placeholder="Search chats..." autocomplete="off" aria-label="Search chats">
        </label>
        <div class="contact-list" id="contactList" role="list"></div>
    </aside>

    <main class="chat-section">
        <header class="chat-header">
            <div class="avatar" id="contactAvatar" aria-hidden="true">V</div>
            <div class="contact-heading">
                <h1 id="contactName">Select a chat</h1>
                <p id="contactStatus"></p>
            </div>
            <span class="chat-type" id="chatType"></span>
        </header>
        <section class="chat-messages" id="chatMessages" aria-label="Conversation" aria-live="polite">
            <p class="empty-state">Open VYBE in another browser to start a conversation.</p>
        </section>
        <form class="message-input" id="messageForm">
            <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.doc,.docx,.txt,.rtf,.xls,.xlsx,.ppt,.pptx,.zip" hidden>
            <button class="attach-button" id="attachButton" type="button" aria-label="Attach an image, video, or document" title="Attach file">＋</button>
            <div class="composer">
                <div class="attachment-preview" id="attachmentPreview" hidden></div>
                <input type="text" id="messageInput" placeholder="Write a message..." autocomplete="off" aria-label="Message" maxlength="10000">
            </div>
            <button class="send-button" id="sendButton" type="submit">Send <span aria-hidden="true">➤</span></button>
        </form>
        <p class="storage-note" id="statusMessage" role="status" aria-live="polite">Messages are stored securely in the VYBE database.</p>
    </main>
</div>

<dialog class="group-dialog glass-card" id="groupDialog" aria-labelledby="groupDialogTitle">
    <form id="groupForm">
        <button class="dialog-close" id="cancelGroup" type="button" aria-label="Close dialog">×</button>
        <p class="eyebrow">MAKE IT A GROUP</p>
        <h2 id="groupDialogTitle">Create a group</h2>
        <label class="group-name-label" for="groupName">Group name</label>
        <input id="groupName" name="groupName" maxlength="60" required autocomplete="off" placeholder="e.g. Weekend plans">
        <fieldset class="group-members" id="groupMembers">
            <legend>Add people</legend>
            <p class="empty-state">Your contacts will appear here.</p>
        </fieldset>
        <p class="form-error" id="groupError" role="alert"></p>
        <div class="dialog-actions">
            <button class="cancel-button" id="cancelGroupFooter" type="button">Cancel</button>
            <button class="send-button" type="submit">Create group</button>
        </div>
    </form>
</dialog>
<script src="chat.js"></script>
</body>
</html>
